[tox]
envlist = 
    py{38,39,310,311}-django{32,40,41,42}-wagtail{40,50}
skipsdist = False

[gh-actions]
python =
    3.8: py38
    3.9: py39
    3.10: py310
    3.11: py311

[testenv]
setenv =
    DJANGO_SETTINGS_MODULE=test_settings
    PYTHONPATH={toxinidir}
deps =
    django32: Django>=3.2,<4.0
    django40: Django>=4.0,<4.1
    django41: Django>=4.1,<4.2
    django42: Django>=4.2,<5.0
    wagtail40: wagtail>=4.0,<5.0
    wagtail50: wagtail>=5.0,<6.0
    pytest>=6.0
    pytest-django>=4.0
    pytest-cov>=4.0
    python-dateutil>=2.8.0
    stripe>=5.0.0

commands = pytest tests/ -v {posargs}

[testenv:docs]
deps = 
    sphinx>=5.0
    sphinx-rtd-theme>=1.0
    myst-parser>=0.18
commands = sphinx-build -b html docs docs/_build/html

[testenv:lint]
deps = 
    flake8>=4.0
    black>=22.0
    isort>=5.0
commands = 
    flake8 wagtail_subscriptions/ tests/
    black --check wagtail_subscriptions/ tests/
    isort --check-only wagtail_subscriptions/ tests/