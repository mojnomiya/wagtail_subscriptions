[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wagtail-subscriptions"
version = "0.1.0"
description = "A comprehensive subscription management system for Wagtail CMS"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Wagtail Subscriptions Team", email = "contact@wagtail-subscriptions.org"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 3.2",
    "Framework :: Django :: 4.0",
    "Framework :: Django :: 4.1",
    "Framework :: Django :: 4.2",
    "Framework :: Wagtail",
    "Framework :: Wagtail :: 4",
    "Framework :: Wagtail :: 5",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
requires-python = ">=3.8"
dependencies = [
    "Django>=3.2,<5.0",
    "wagtail>=4.0,<6.0",
    "python-dateutil>=2.8.0",
    "stripe>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-django>=4.0",
    "coverage>=6.0",
    "black>=22.0",
    "isort>=5.0",
    "flake8>=4.0",
    "pylint>=2.0",
    "mypy>=1.0",
    "bandit>=1.7",
    "stripe>=5.0",
    "paypalrestsdk>=1.13",
]

[project.urls]
Homepage = "https://github.com/wagtail-subscriptions/wagtail-subscriptions"
Documentation = "https://wagtail-subscriptions.readthedocs.io/"
Repository = "https://github.com/wagtail-subscriptions/wagtail-subscriptions"
"Bug Tracker" = "https://github.com/wagtail-subscriptions/wagtail-subscriptions/issues"

[tool.setuptools.packages.find]
include = ["wagtail_subscriptions*"]

[tool.setuptools.package-data]
wagtail_subscriptions = [
    "templates/**/*",
    "static/**/*",
    "migrations/**/*",
]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["*/migrations/*", "*/venv/*", "*/.venv/*"]

[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
    "R0903",  # too-few-public-methods
]

[tool.pylint.format]
max-line-length = 100

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["migrations/", "venv/", ".venv/"]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "test_settings"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"