name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, '3.10', '3.11']
        django-version: [3.2, 4.1, 4.2]
        wagtail-version: [4.0, 5.0]
        exclude:
          - python-version: 3.9
            django-version: 4.2

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox tox-gh-actions
    
    - name: Test with tox
      run: tox
      env:
        DJANGO_VERSION: ${{ matrix.django-version }}
        WAGTAIL_VERSION: ${{ matrix.wagtail-version }}

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
    - name: Lint with flake8
      run: python -m flake8 wagtail_subscriptions/ tests/
    - name: Check formatting with black
      run: python -m black --check wagtail_subscriptions/ tests/
    - name: Check import sorting with isort
      run: python -m isort --check-only wagtail_subscriptions/ tests/
    - name: Lint with pylint
      run: python -m pylint wagtail_subscriptions/ || true
    - name: Type check with mypy
      run: python -m mypy wagtail_subscriptions/ || true
    - name: Security check with bandit
      run: python -m bandit -r wagtail_subscriptions/ -ll || true

  coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
    - name: Run tests with coverage
      run: |
        python -m pytest tests/ --cov=wagtail_subscriptions --cov-report=xml
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4